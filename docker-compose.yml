services:
  odwolania2json:
    build: .
    volumes:
      - ./input:/app/input
      - ./output:/app/output
    environment:
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_API_BASE=${LLM_API_BASE:-https://api.mistral.ai/v1}
      - LLM_MODEL=${LLM_MODEL:-ministral-3b-2512}
    command: ["python", "app.py", "input", "output"]
