# Klasy dokumentów Odwołania2JSON (UZP / HackNation 2026).
# NOWĄ klasę dokumentu dodaje się TYLKO tutaj — bez zmiany kodu źródłowego:
#   weighted_keywords / keywords / negative_keywords — klasyfikacja po treści,
#   extract — struktura wynikowego JSON-a i reguła dla każdego pola (wzór: przystapienie),
#   prompt_hint — kontekst dla LLM-a (tylko dla pól z llm: true, puste po regułach).
# Aplikacja wczytuje ten plik przy starcie.
version: 1
classify_min_score: 4
classes:
  odwolanie:
    label: "Odwołanie do KIO"
    weighted_keywords:
      - ["zarzut nr", 5]
      - ["odwołujący:", 4]
      - ["zamawiający:", 3]
      - ["prezes krajowej izby odwoławczej", 4]
      - ["krajowa izba odwoławcza", 3]
      - ["krajowej izby odwoławczej", 3]
      - ["wnoszę odwołanie", 4]
      - ["odwołanie", 2]
    keywords:
      - "ODWOŁANIE"
      - "Prezes Krajowej Izby Odwoławczej"
      - "Odwołujący:"
      - "Zarzut nr"
    # Orzeczenia KIO (wyroki, postanowienia) używają słownictwa odwołań i przystąpień,
    # ale są dokumentami obcymi -> pusty JSON {}. Każde trafienie ODEJMUJE wagę.
    # Lista wspólna dla wszystkich klas (kotwica YAML &orzeczenie_kio).
    negative_keywords: &orzeczenie_kio
      - ["orzeka:", 6]
      - ["postanawia:", 6]
      - ["po rozpoznaniu na posiedzeniu", 4]
      - ["po rozpoznaniu na rozprawie", 4]
      - ["przewodniczący:", 3]
      - ["protokolant:", 3]
    schema_file: "oczekiwane-json/odwolanie.json"
    fields:
      - "OdwolanieKIO.data"
      - "OdwolanieKIO.czynnosc_dzien"
      - "OdwolanieKIO.czynnosc_powod_id"
      - "OdwolanieKIO.czynnosc_opis"
      - "OdwolanieKIO.miejscowosc"
      - "Odwolujacy[].krs"
      - "Odwolujacy[].nazwa"
      - "Odwolujacy[].nip"
      - "Odwolujacy[].regon"
      - "Odwolujacy[].przez-pelnomocnika"
      - "Odwolujacy[].pelnomocnik.imie_nazwisko"
      - "Odwolujacy[].pelnomocnik.nazwa"
      - "Odwolujacy[].pelnomocnik.mail"
      - "Zamawiajacy[].krs"
      - "Zamawiajacy[].nazwa"
      - "Zamawiajacy[].nip"
      - "Zamawiajacy[].regon"
      - "Zamawiajacy[].prowadzacy_postepowanie"
      - "ZamowieniePubliczne.numer_bzp"
      - "ZamowieniePubliczne.numer_postepowania"
      - "ZamowieniePubliczne.numer_ted"
      - "ZamowieniePubliczne.tytul"
    prompt_hint: "Dokument to odwołanie do Krajowej Izby Odwoławczej. Wyciągnij strony postępowania, dane zamówienia i zaskarżoną czynność."

  pelnomocnictwo:
    label: "Pełnomocnictwo"
    weighted_keywords:
      - ["pełnomocnictwo", 5]
      - ["mocodawc", 4]
      - ["ustanawiam pełnomocnikiem", 4]
      - ["udzielam pełnomocnictwa", 4]
      - ["pełnomocnik jest umocowany", 4]
      - ["do reprezentowania", 2]
      - ["pełnomocnik", 2]
    keywords:
      - "PEŁNOMOCNICTWO"
      - "Mocodawca"
      - "Pełnomocnik jest umocowany"
      - "udzielam pełnomocnictwa"
    negative_keywords: *orzeczenie_kio
    schema_file: "oczekiwane-json/pelnomocnictwo.json"
    fields:
      - "mocodawca[].data.imie_nazwisko"
      - "mocodawca[].data.krs"
      - "mocodawca[].data.nazwa"
      - "mocodawca[].data.nip"
      - "mocodawca[].data.typ"
      - "mocodawca[].podpisujacy[].imie_nazwisko"
      - "pelnomocnicy[].imie_nazwisko"
      - "pelnomocnicy[].pesel"
    prompt_hint: "Dokument to pełnomocnictwo. Wyciągnij mocodawcę, osoby podpisujące i pełnomocników."

  przelew:
    label: "Potwierdzenie przelewu"
    weighted_keywords:
      - ["potwierdzenie wykonania przelewu", 5]
      - ["potwierdzenie realizacji polecenia przelewu", 5]
      - ["potwierdzenie realizacji przelewu", 5]
      - ["polecenie przelewu", 5]
      - ["potwierdzenie przelewu", 5]
      - ["dowód wykonania przelewu", 5]
      - ["potwierdzenie operacji bankowej", 5]
      - ["potwierdzenie transakcji", 5]
      - ["przelew elixir", 5]
      - ["przelew krajowy", 5]
      - ["szczegóły zlecenia", 4]
      - ["typ zlecenia", 4]
      - ["typ przelewu", 4]
      - ["typ transakcji", 4]
      - ["kwota przelewu", 4]
      - ["z rachunku", 3]
      - ["na rachunek", 3]
      - ["dane nadawcy", 3]
      - ["dane odbiorcy", 3]
      - ["dane kontrahenta", 3]
      - ["rachunek kontrahenta", 4]
      - ["rachunek odbiorcy", 3]
      - ["rachunek zleceniodawcy", 4]
      - ["rachunek nadawcy", 3]
      - ["rachunek obciążany", 3]
      - ["rachunek beneficjenta", 3]
      - ["tytuł przelewu", 3]
      - ["data operacji", 2]
      - ["data wykonania", 3]
      - ["data księgowania", 2]
      - ["kwota operacji", 2]
      - ["zleceniodawca", 2]
      - ["beneficjent", 2]
      - ["przelew", 2]
    keywords:
      - "POLECENIE PRZELEWU"
      - "POTWIERDZENIE WYKONANIA PRZELEWU"
      - "Potwierdzenie realizacji polecenia przelewu"
      - "Potwierdzenie przelewu"
      - "Dowód wykonania przelewu"
      - "Potwierdzenie operacji bankowej"
      - "Potwierdzenie transakcji"
      - "Rachunek obciążany"
      - "Rachunek zleceniodawcy"
      - "Rachunek odbiorcy"
      - "Zleceniodawca"
      - "Tytuł przelewu"
      - "Data operacji"
      - "Kwota operacji"
    negative_keywords: *orzeczenie_kio
    schema_file: "oczekiwane-json/przelew.json"
    fields:
      - "przelew_bankowy.data_operacji"
      - "przelew_bankowy.kwota"
      - "przelew_bankowy.na_rachunek"
      - "przelew_bankowy.numer_transakcji"
      - "przelew_bankowy.tytul"
      - "przelew_bankowy.z_rachunku"
    prompt_hint: "Dokument to potwierdzenie przelewu bankowego. Wyciągnij datę, kwotę, rachunki, numer transakcji i tytuł."

  przystapienie:
    label: "Zgłoszenie przystąpienia do postępowania odwoławczego"
    weighted_keywords:
      - ["zgłoszenie przystąpienia do postępowania odwoławczego", 6]
      - ["przystąpienie do postępowania odwoławczego", 5]
      - ["zgłoszenie przystąpienia", 5]
      - ["zgłaszam przystąpienie", 5]
      - ["zgłasza przystąpienie", 5]
      - ["przystępujący:", 4]
      - ["art. 524", 4]
      - ["po stronie odwołującego", 3]
      - ["po stronie zamawiającego", 3]
      - ["przystąpienie", 2]
    keywords:
      - "ZGŁOSZENIE PRZYSTĄPIENIA"
      - "PRZYSTĄPIENIE DO POSTĘPOWANIA ODWOŁAWCZEGO"
      - "Przystępujący:"
      - "art. 524 Pzp"
      - "po stronie odwołującego"
      - "po stronie zamawiającego"
    negative_keywords: *orzeczenie_kio
    schema_file: "config/schemas/przystapienie.json"
    prompt_hint: "Dokument to zgłoszenie przystąpienia do postępowania odwoławczego przed KIO (art. 524 Pzp)."
    # Blok strony postępowania: od etykiety do pierwszej z etykiet `until`.
    party: &przystepujacy
      label: ["Przystępujący:", "Wykonawca przystępujący:", "Przystępujący wykonawca:"]
      until: ["Zamawiający", "Odwołujący", "ZGŁOSZENIE", "Dotyczy", "Wnoszę", "Działając"]
    # Ekstrakcja deklaratywna: struktura wynikowego JSON-a = zagnieżdżenie kluczy,
    # liść = reguła (budulce silnika w extractor.py, wspólne dla każdej nowej klasy):
    #   header_date | header_place | party_name | party_id (id: nip/krs/regon/pesel) |
    #   numer_postepowania (labels) | regex (pattern, group, normalize) |
    #   choice (options: [wartość, wzorzec]) | signers | const (value)
    # llm: true -> pole puste po regułach może uzupełnić LLM; wartość przyjmujemy tylko
    #             po walidacji formatu i gdy występuje w tekście dokumentu.
    extract:
      przystepujacy:
        nazwa: {rule: party_name, <<: *przystepujacy, llm: true}
        nip: {rule: party_id, id: nip, <<: *przystepujacy, llm: true}
        krs: {rule: party_id, id: krs, <<: *przystepujacy, llm: true}
        regon: {rule: party_id, id: regon, <<: *przystepujacy, llm: true}
      numer_postepowania:
        rule: numer_postepowania
        labels:
          - 'n(?:ume)?r\.?\s+referencyjny(?:\s+(?:sprawy|postępowania))?(?:\s+nr)?'
          - 'n(?:ume)?r\.?\s+postępowania'
          - 'znak\s+sprawy'
          - 'postępowani[au]\s+nr'
        llm: true
      strona:
        rule: choice
        options:
          - ["po stronie odwołującego", 'po\s+stronie\s+odwołujące']
          - ["po stronie zamawiającego", 'po\s+stronie\s+zamawiające']
        llm: true
      data: {rule: header_date, llm: true}
      podpisujacy: {rule: signers, llm: true}

# Mapa powodu odwołania — TYLKO z pierwszego zarzutu (Zarzut nr 1).
# Zgodna ze słownikiem UZP (hacknation-uzp-repo/oczekiwane-json/czynnosc_powod_id_dict.md).
czynnosc_powod:
  1: "Decyzja o odrzuceniu oferty"
  2: "Ogłoszenie wyboru oferty"
  3: "Decyzja o wykluczeniu wykonawcy"
  4: "Publikacja specyfikacji warunków zamówienia (SWZ)"
  5: "Modyfikacja treści SWZ"
  6: "Odpowiedzi/wyjaśnienia do SWZ"
  7: "Zaniechanie odrzucenia oferty"
  8: "Zaniechanie wykluczenia wykonawcy"
  9: "Decyzja o unieważnieniu postępowania"
  10: "Zaniechanie unieważnienia postępowania"
  11: "Opis przedmiotu zamówienia (OPZ)"
  12: "Projektowane postanowienia umowy"

# Słowa kluczowe w zdaniu o zaskarżonej czynności -> id powodu.
# Kolejność ma znaczenie: najpierw warianty "zaniechanie", potem pozostałe.
czynnosc_keywords:
