  - ["zaniechania odrzucenia", "zaniechanie odrzucenia", "zaniechaniu odrzucenia", 7]
  - ["zaniechania wykluczenia", "zaniechanie wykluczenia", "zaniechaniu wykluczenia", 8]
  - ["unieważnienia postępowania", "unieważnieniu postępowania", "unieważnił postępowanie", "unieważnienie postępowania", 9]
  - ["odrzucenia oferty", "odrzuceniu oferty", "odrzucił ofertę", "odrzucenie oferty", 1]
  - ["wykluczenia wykonawcy", "wykluczeniu wykonawcy", "wykluczył wykonawcę", "wykluczenie wykonawcy", 3]
  - ["wyboru oferty", "wyborze oferty", "wybrał ofertę", "ogłoszenie wyboru oferty", "dokonał wyboru", 2]
  - ["modyfikacji swz", "modyfikacja treści swz", "zmienił treść swz", "zmiana treści swz", 5]
  - ["udzielił wyjaśnień", "udzielenie wyjaśnień", "odpowiedzi i wyjaśnienia", "wyjaśnienia do swz", "wyjaśnień do swz", 6]
  - ["publikacji swz", "publikację swz", "publikacja swz", "publikacja specyfikacji", "specyfikacji warunków zamówienia", 4]
  - ["opisu przedmiotu zamówienia", "opisie przedmiotu zamówienia", "opis przedmiotu zamówienia", 11]
  - ["projektowane postanowienia umowy", "projektowanych postanowień umowy", "projektowane postanowienia", "postanowienia umowy", "postanowień umowy", "wzoru umowy", "wzór umowy", 12]
