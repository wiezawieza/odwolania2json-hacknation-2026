<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odwołania2JSON — wgraj PDF, zobacz JSON</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #111; }
  header { background: #0b3d66; color: #fff; padding: 16px 24px; }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; opacity: .85; font-size: 14px; }
  main { padding: 16px 24px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .col { flex: 1 1 420px; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 12px; min-height: 300px; }
  .col h2 { margin-top: 0; font-size: 16px; }
  pre { white-space: pre-wrap; word-break: break-word; font-size: 13px; background: #f0f2f4; padding: 12px; border-radius: 6px; max-height: 70vh; overflow: auto; }
  iframe { width: 100%; height: 70vh; border: 1px solid #ddd; border-radius: 6px; }
  button { background: #0b3d66; color: #fff; border: 0; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-size: 15px; }
  #status { margin: 8px 0; color: #555; }
</style>
</head>
<body>
<header>
  <h1>Odwołania2JSON — UZP / HackNation 2026</h1>
  <p>Wgraj PDF (odwołanie, pełnomocnictwo albo potwierdzenie przelewu) — po lewej zobaczysz dokument, po prawej wygenerowany JSON.</p>
</header>
<main>
  <form id="f">
    <input type="file" id="file" accept=".pdf" required>
    <button type="submit">Uruchom analizę</button>
    <button type="button" id="dl" disabled>Pobierz JSON</button>
  </form>
  <p id="status"></p>
  <div class="row">
    <div class="col"><h2>Dokument źródłowy (PDF)</h2><iframe id="pdf" title="PDF"></iframe></div>
    <div class="col"><h2>Wynik (JSON)</h2><pre id="out">Wybierz plik PDF i kliknij „Uruchom analizę”.</pre></div>
  </div>
</main>
<script>
let lastJson = null;
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const file = document.getElementById('file').files[0];
  if (!file) return;
  document.getElementById('pdf').src = URL.createObjectURL(file);
  document.getElementById('status').textContent = 'Analizuję…';
  const fd = new FormData();
  fd.append('file', file);
  const r = await fetch('/api/extract', { method: 'POST', body: fd });
  const data = await r.json();
  if (data.error) { document.getElementById('status').textContent = 'Błąd: ' + data.error; return; }
  lastJson = data.result;
  document.getElementById('out').textContent = JSON.stringify(data.result, null, 2);
  document.getElementById('status').textContent = 'Typ dokumentu: ' + data.type + (data.info && data.info.ocr ? ' (użyto OCR)' : '');
  document.getElementById('dl').disabled = false;
});
document.getElementById('dl').addEventListener('click', () => {
  if (!lastJson) return;
  const blob = new Blob([JSON.stringify(lastJson, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'wynik.json';
  a.click();
});
</script>
</body>
</html>
